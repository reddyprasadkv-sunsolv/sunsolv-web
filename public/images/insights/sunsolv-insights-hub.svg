<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="hubBg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#071a33"/>
      <stop offset="60%" stop-color="#0a254a"/>
      <stop offset="100%" stop-color="#061324"/>
    </linearGradient>
    <linearGradient id="orbGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#20c5d8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="meshGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#20c5d8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#hubBg)"/>

  <!-- Network Lattice Lines -->
  <g stroke="rgba(32, 197, 216, 0.15)" stroke-width="1.5">
    <line x1="200" y1="120" x2="450" y2="280"/>
    <line x1="450" y1="280" x2="700" y2="180"/>
    <line x1="700" y1="180" x2="950" y2="340"/>
    <line x1="450" y1="280" x2="520" y2="480"/>
    <line x1="700" y1="180" x2="800" y2="440"/>
    <line x1="520" y1="480" x2="800" y2="440"/>
    <line x1="200" y1="120" x2="300" y2="420"/>
    <line x1="300" y1="420" x2="520" y2="480"/>
    <line x1="800" y1="440" x2="1050" y2="500"/>
    <line x1="950" y1="340" x2="1050" y2="500"/>
  </g>

  <!-- Node Circles -->
  <circle cx="200" cy="120" r="8" fill="#20c5d8" opacity="0.6"/>
  <circle cx="450" cy="280" r="14" fill="url(#orbGrad)"/>
  <circle cx="450" cy="280" r="6" fill="#ffffff"/>
  <circle cx="700" cy="180" r="18" fill="url(#orbGrad)"/>
  <circle cx="700" cy="180" r="8" fill="#ffffff"/>
  <circle cx="950" cy="340" r="12" fill="url(#orbGrad)"/>
  <circle cx="950" cy="340" r="5" fill="#20c5d8"/>
  <circle cx="520" cy="480" r="16" fill="url(#orbGrad)"/>
  <circle cx="520" cy="480" r="7" fill="#ffffff"/>
  <circle cx="800" cy="440" r="14" fill="url(#orbGrad)"/>
  <circle cx="800" cy="440" r="6" fill="#20c5d8"/>

  <!-- Subtle Concentric Waves -->
  <circle cx="700" cy="180" r="60" stroke="rgba(32, 197, 216, 0.12)" stroke-width="1" fill="none"/>
  <circle cx="700" cy="180" r="120" stroke="rgba(32, 197, 216, 0.08)" stroke-width="1" stroke-dasharray="6 6" fill="none"/>
  <circle cx="520" cy="480" r="80" stroke="rgba(37, 99, 235, 0.15)" stroke-width="1" fill="none"/>

  <!-- Knowledge Node Cards floating -->
  <g transform="translate(680, 240)">
    <rect width="260" height="90" rx="10" fill="rgba(7, 26, 51, 0.75)" stroke="rgba(32, 197, 216, 0.3)" stroke-width="1"/>
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="700" fill="#20c5d8" letter-spacing="1">PERSPECTIVES</text>
    <text x="20" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Manrope', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Practical Technology Guidance</text>
    <text x="20" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#94a3b8">Strategy, Cloud, AI &amp; Engineering</text>
  </g>
</svg>
