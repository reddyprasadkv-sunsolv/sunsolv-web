name: Deploy SunSolv website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - name: Code Quality Checks
        run: |
          npm run format:check
          npm run typecheck
          npm test -- --watch=false
      - run: npm run build
      - run: node scripts/prepare-pages.mjs
        env:
          ENQUIRY_API_ORIGIN: ${{ vars.ENQUIRY_API_ORIGIN }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/sunsolv-redesign/browser
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
